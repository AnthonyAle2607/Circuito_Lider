# Parrilla de Circuito Líder tal como la publica circuitolider.com (revisión del 2026-11-05).
# Se carga con `pnpm cargar-parrilla`: solo añade lo que falta, nunca pisa lo que el equipo corrigió en el panel.
#
# Horas en hora de Venezuela (America/Caracas). Días ISO: 1 = lunes … 7 = domingo.
# Lo que NO está publicado y queda marcado:
#  - segundos_tanda: ESTIMADO (pregunta abierta 3). Todas las franjas entran con cupo_confirmado = false.
#    Supuesto: 4 minutos de tanda por hora de programa (240 s/h).
#  - Las horas entre programas (música continua) no se publican y no se cargan todavía.
#  - El 3 Pack en Mérida («L–D en 4 horarios») no publica sus horas: no se carga.
#  - Play House Líder (21:00–01:00) cruza la medianoche: se parte en 21:00–24:00 y 00:00–01:00 del día siguiente.
#  - En Mérida, El Brunch (10–12) se cruza con CONVOCADOS (11–13, nacional). Se carga como está publicado;
#    hay que confirmar con la emisora cuál suena de 11 a 12.

circuito: Circuito Líder
segundos_por_hora: 240

emisoras:
  # stream: señal en vivo que usa el reproductor de circuitolider.com (Icecast, AAC 64 kbps), revisada el 2026-11-18.
  # descripcion: texto PROVISIONAL redactado por Invermedia con lo que publica la web; confirmarlo con Circuito Líder.
  # Margarita se añadió el 2026-11-18: su página no publica programas; se supone que lleva la cadena nacional.
  - slug: caracas
    nombre: Líder Caracas
    ciudad: Caracas
    frecuencia: 94.9 FM
    stream: https://acp4.lorini.net:15020/stream
    descripcion: "La señal Líder de la capital: pop y rock en inglés y español y los éxitos del momento. Además de la cadena nacional, es la emisora con más programas propios del circuito, de lunes a domingo."
  - slug: valencia
    nombre: Líder Valencia
    ciudad: Valencia
    frecuencia: 106.7 FM
    stream: https://acp4.lorini.net:15028/stream
    descripcion: "Líder en Valencia: pop y rock en inglés y español y los éxitos del momento, con los programas en cadena nacional de lunes a viernes."
  - slug: merida
    nombre: Líder Mérida
    ciudad: Mérida
    frecuencia: 92.3 FM
    stream: https://acp4.lorini.net:15022/stream
    descripcion: "Líder en Mérida: pop y rock en inglés y español, la cadena nacional y programas propios de la ciudad entre semana y los fines de semana."
  - slug: san-cristobal
    nombre: Líder San Cristóbal
    ciudad: San Cristóbal
    frecuencia: 91.1 FM
    stream: https://acp4.lorini.net:15024/stream
    descripcion: "Líder en San Cristóbal: pop y rock en inglés y español y los éxitos del momento, con los programas en cadena nacional de lunes a viernes."
  - slug: barquisimeto
    nombre: Líder Barquisimeto
    ciudad: Barquisimeto
    frecuencia: 94.9 FM
    stream: https://acp4.lorini.net:15026/stream
    descripcion: "Líder en Barquisimeto: pop y rock en inglés y español y los éxitos del momento, con los programas en cadena nacional de lunes a viernes."
  - slug: maracaibo
    nombre: Líder Maracaibo
    ciudad: Maracaibo
    frecuencia: 100.5 FM
    stream: https://acp4.lorini.net:15030/stream
    descripcion: "Líder en Maracaibo: pop y rock en inglés y español, la cadena nacional entre semana y programa propio los fines de semana."
  - slug: puerto-ordaz
    nombre: Líder Puerto Ordaz
    ciudad: Puerto Ordaz
    frecuencia: 100.3 FM
    stream: https://acp4.lorini.net:15032/stream
    descripcion: "Líder en Puerto Ordaz: pop y rock en inglés y español y los éxitos del momento, con los programas en cadena nacional de lunes a viernes."
  - slug: el-vigia
    nombre: Líder El Vigía
    ciudad: El Vigía
    frecuencia: 100.1 FM
    stream: https://acp4.lorini.net:15034/stream
    descripcion: "Líder en El Vigía: pop y rock en inglés y español y los éxitos del momento, con los programas en cadena nacional de lunes a viernes."
  - slug: puerto-la-cruz
    nombre: Líder Puerto La Cruz
