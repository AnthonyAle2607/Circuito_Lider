# descripcion de programas: PROVISIONAL, solo con lo que se sabe (horario, alcance, conductores); confirmar con la emisora.
# Programas en cadena: suenan a la vez en las diez emisoras («Hora Nacional»).
nacionales:
  - nombre: ENCENDIDOS
    locutores: Angélica Gómez, Jesús Berbín, Kate Ramos
    descripcion: "La mañana en cadena nacional: suena a la vez en las diez emisoras Líder mientras el país arranca el día."
    franjas: [{ dias: [1, 2, 3, 4, 5], inicio: "06:00", fin: "09:00" }]
  - nombre: CONVOCADOS
    locutores: Guillermo Arcay, Eduardo Pino, Carlos Marcano
    descripcion: "El mediodía en cadena nacional, a la vez en las diez emisoras Líder."
    franjas: [{ dias: [1, 2, 3, 4, 5], inicio: "11:00", fin: "13:00" }]
  - nombre: AL AIRE
    locutores: Auri Castillo, Abel Saraiba
    descripcion: "La tarde en cadena nacional, a la vez en las diez emisoras Líder, a la hora de la salida del trabajo."
    franjas: [{ dias: [1, 2, 3, 4, 5], inicio: "17:00", fin: "18:00" }]

