name: CI

on:
  push:
    branches: [main, 'pt-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # El portal y el panel deben compilar para producción (detecta errores que el modo desarrollo deja pasar).
      - run: pnpm --filter @sp/portal --filter @sp/panel build

  migraciones:
    name: Migraciones y concurrencia contra Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pautas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pautas"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://postgres:postgres@127.0.0.1:5432/pautas
      PRUEBAS_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dos veces: la segunda debe encontrar todo al día (las migraciones son repetibles sin efecto).
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      # La parrilla y el tarifario de ejemplo se cargan sobre la base real, dos veces (la segunda no debe cambiar nada).
      - run: pnpm cargar-parrilla && pnpm cargar-parrilla
      - run: pnpm cargar-tarifario-ejemplo && pnpm cargar-tarifario-ejemplo
      # Criterio de PT-3: 50 reservas simultáneas sobre el último cupo, solo una gana (necesita conexiones reales).
      - name: Concurrencia del inventario
        run: pnpm --filter @sp/inventory exec vitest run test/concurrencia.pg.test.ts
